<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="./styles/login.css">
    <script src="../back/login.js"></script>
</head>
<body>
    <img src="../logo_cone.png" alt="Consultora de Negocios Empresarios">
    <div class="container">
        <h1>Bejerman <span>ERP</span></h1>
        
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="usuario" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="contraseña" name="password" required>
            </div>
            <div class="error" >
                <p id="error"></p>
            </div>
            <button type="submit" class="btn" onclick="login()">Ingresar</button>
            
    </div>
</body>
</html>
